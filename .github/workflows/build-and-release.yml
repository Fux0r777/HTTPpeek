name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests pyinstaller

      - name: Build Linux executable
        run: pyinstaller --onefile --name python-url-scanner-linux main.py

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: python-url-scanner-linux
          path: dist/python-url-scanner-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests pyinstaller

      - name: Build Windows executable
        run: pyinstaller --onefile --name python-url-scanner-windows main.py

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: python-url-scanner-windows
          path: dist/python-url-scanner-windows.exe

  release:
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: python-url-scanner-linux
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: python-url-scanner-windows
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/python-url-scanner-linux
            release/python-url-scanner-windows.exe
